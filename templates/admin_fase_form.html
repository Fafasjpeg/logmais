<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ 'Editar fase' if fase else 'Nova fase' }} — Admin LOG+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
</head>
<body class="tema-{{ session.get('tema', 'padrao') }} fonte-{{ session.get('tamanho_fonte', 'normal') }}">
<div class="admin-shell">
  <div class="admin-topo">
    <h1>LOG+ Admin</h1>
    <nav class="admin-nav">
      <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
      <a href="{{ url_for('admin_usuarios') }}">Usuários</a>
      <a href="{{ url_for('admin_fases') }}">Fases</a>
      <a href="{{ url_for('admin_recompensas') }}">Recompensas</a>
      <a href="{{ url_for('admin_rotinas') }}">Rotinas</a>
      <a href="{{ url_for('admin_relatorios') }}">Relatórios</a>
      <a href="{{ url_for('admin_feedbacks') }}">Feedbacks</a>
      <a href="{{ url_for('logout') }}">Sair</a>
    </nav>
  </div>

  <h2 class="admin-titulo-pagina">{{ 'Editar fase' if fase else 'Nova fase' }}</h2>

  {% with mensagens = get_flashed_messages() %}
    {% if mensagens %}<ul class="avisos">{% for m in mensagens %}<li>{{ m }}</li>{% endfor %}</ul>{% endif %}
  {% endwith %}

  <form method="post" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Nome da fase
      <input type="text" name="nome_fase" value="{{ fase.nome_fase if fase else '' }}" required>
    </label>
    <label>Ordem na trilha
      <input type="number" name="ordem" min="1" value="{{ fase.ordem if fase else '' }}" required>
    </label>
    <div class="admin-acoes">
      <button type="submit" class="admin-botao admin-botao-primario">Salvar</button>
      <a class="admin-botao admin-botao-secundario" href="{{ url_for('admin_fases') }}">Voltar</a>
    </div>
  </form>
</div>
</body>
</html>
