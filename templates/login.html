<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — LOG+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
</head>
<body class="tema-{{ session.get('tema', 'padrao') }} fonte-{{ session.get('tamanho_fonte', 'normal') }}">
<div class="tela-auth">
  <header class="auth-topo">
    <h1>Seja bem-vindo!</h1>
  </header>
  <main class="auth-conteudo">
    <p class="logo"><span class="logo-log">LOG</span><span class="logo-mais">+</span></p>

    {% with mensagens = get_flashed_messages(with_categories=true) %}
      {% if mensagens %}
        <ul class="avisos {{ 'avisos-sucesso' if mensagens[0][0] == 'sucesso' }}">
          {% for categoria, mensagem in mensagens %}<li>{{ mensagem }}</li>{% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post" class="form-auth">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="email" name="email" placeholder="E-mail" required>
      <input type="password" name="senha" placeholder="Senha" required>
      <button type="submit" class="botao-primario">Login</button>
    </form>

    <p class="links-auth">
      <a href="{{ url_for('cadastro') }}">Criar Conta</a> | <a href="{{ url_for('recuperar_senha') }}">Esqueceu a senha?</a>
    </p>
  </main>
  <footer class="auth-rodape">© 2026 Log+. Todos os direitos reservados.</footer>
</div>
</body>
</html>
