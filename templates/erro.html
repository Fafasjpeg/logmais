<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titulo }} — LOG+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
</head>
<body class="tema-{{ session.get('tema', 'padrao') }} fonte-{{ session.get('tamanho_fonte', 'normal') }}">
<div class="tela-auth">
  <header class="auth-topo"><h1>Ops!</h1></header>
  <main class="auth-conteudo">
    <p class="logo"><span class="logo-log">LOG</span><span class="logo-mais">+</span></p>

    <p style="font-size:18px; font-weight:600; color:#397ad5; text-align:center; margin:0 0 8px;">{{ titulo }}</p>
    <p style="font-size:14px; text-align:center; margin:0 0 24px; max-width:280px;">{{ mensagem }}</p>

    <a href="{{ url_for('index') }}" class="botao-primario" style="text-decoration:none; display:block; text-align:center; width:100%; max-width:280px;">Voltar pro início</a>
  </main>
  <footer class="auth-rodape">© 2026 Log+. Todos os direitos reservados.</footer>
</div>
</body>
</html>
