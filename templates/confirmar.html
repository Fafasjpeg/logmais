{% extends "base.html" %}
{% block title %}Confirmar — LOG+{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
{% endblock %}
{% block content %}
<div class="tela-app">
  <header class="topo-azul"><h1>Confirmar</h1></header>
  <main class="conteudo-app" style="display:flex; align-items:center; justify-content:center;">
    <div class="cartao" style="text-align:center;">
      <p style="font-size:36px; margin:0 0 6px;">⚠️</p>
      <p class="cartao-titulo">{{ titulo }}</p>
      <p class="cartao-corpo">{{ mensagem }}</p>
      <form method="post" action="{{ url_confirmar }}">
        <button type="submit" class="botao-primario" style="width:100%; background:#b3261e;">{{ rotulo_confirmar }}</button>
      </form>
      <a class="botao-secundario" style="margin-top:10px;" href="{{ url_cancelar }}">Cancelar</a>
    </div>
  </main>
</div>
{% endblock %}
