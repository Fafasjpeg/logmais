<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar — LOG+</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/acessibilidade.css') }}">
</head>
<body class="tema-{{ session.get('tema', 'padrao') }} fonte-{{ session.get('tamanho_fonte', 'normal') }}">
<div class="tela-app">
  <header class="topo-azul"><h1>Confirmar</h1></header>
  <main class="conteudo-app" style="display:flex; align-items:center; justify-content:center;">
    <div class="cartao" style="text-align:center;">
      <p class="cartao-titulo">Atenção: {{ titulo }}</p>
      <p class="cartao-corpo">{{ mensagem }}</p>
      <form method="post" action="{{ url_confirmar }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="botao-primario" style="width:100%; background:#b3261e;">{{ rotulo_confirmar }}</button>
      </form>
      <a class="botao-secundario" style="margin-top:10px;" href="{{ url_cancelar }}">Cancelar</a>
    </div>
  </main>
</div>
</body>
</html>
